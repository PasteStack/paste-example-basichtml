// paste-assetgraph configuration for the example site. Paths resolve against
// the repository root.
//
// paste core and paste-elements are separate releases, and this repository
// must not encode where a machine keeps them, so scripts/build-dist.sh appends
// `include-paths` from PASTE_CORE_JS and PASTE_ELEMENTS and writes the result
// to target/paste-assetgraph.conf. Build through that script, never against
// this file directly.
source.dirs = ["src/scss", "src/js"]
output.base = "dist"
output.js = "dist/js"
output.css = "dist/css"
manifest = "target/paste-assetgraph-manifest.json"
minify = true
